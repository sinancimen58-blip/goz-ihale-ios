name: Scheduled source collection
on:
  schedule:
    - cron: '0 6,14 * * 1-5'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger VPS collector and persist results on server
        env:
          API_TOKEN: ${{ secrets.GOZ_IHALE_API_WRITE_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then echo "Missing GOZ_IHALE_API_WRITE_TOKEN repository secret"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 \\
            -X POST -H "X-Goz-Ihale-Token: $API_TOKEN" \\
            http://89.251.18.186/api/run-enabled-sources
