name: Scheduled source collection
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual test only; scheduled collection will be enabled after HTTPS is configured"
        required: false
        type: string
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Safety gate
        run: |
          echo "Collection trigger intentionally paused until API HTTPS is configured."
          echo "Do not transmit API write tokens over plain HTTP."
          exit 1
