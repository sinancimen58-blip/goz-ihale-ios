name: Official source live smoke test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/collector/**"
      - "backend/requirements.txt"
      - ".github/workflows/official-source-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 6,14 * * 1-5"

jobs:
  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Probe two required official sources and optional sources
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import os, tempfile
          from datetime import datetime, timezone

          temp = tempfile.mkdtemp(prefix="gozihale-smoke-")
          source_keys = "khgm_central_notices,dmo,khgm_supply,deu_hospital_purchase,pau_hospital_purchase,ekap"
          os.environ["GOZ_IHALE_ENABLED_SOURCE_KEYS"] = source_keys
          os.environ["GOZ_IHALE_HTML_SOURCE_KEYS"] = source_keys
          os.environ["GOZ_IHALE_HTML_PAGE_KHGM_CENTRAL_NOTICES"] = "https://khgm.saglik.gov.tr/TR-119527/ihale-duyurulari.html"
          os.environ["GOZ_IHALE_HTML_PAGE_KHGM_SUPPLY"] = "https://khgmsatinalmadb.saglik.gov.tr/TR-43358/duyurular.html?Sayfa=1"
          os.environ["GOZ_IHALE_HTML_PAGE_DEU_HOSPITAL_PURCHASE"] = "https://hastane2.deu.edu.tr/satin-alma/"
          os.environ["GOZ_IHALE_HTML_PAGE_PAU_HOSPITAL_PURCHASE"] = "https://www.pau.edu.tr/ihale/tr"
          os.environ["GOZ_IHALE_HTML_PAGE_EKAP"] = "https://ekap.kik.gov.tr/ekap/ilan/bultenindirme.aspx"
          os.environ["GOZ_IHALE_HTML_PAGE_DMO"] = "https://www.dmo.gov.tr/Ihale/Liste?type=1"
          os.environ["GOZ_IHALE_INGEST_DB"] = os.path.join(temp, "ingestion.db")
          os.environ["GOZ_IHALE_SCAN_DB"] = os.path.join(temp, "scan.db")

          from app.collector.runner import run_source

          rows = []
          required = ("khgm_central_notices", "dmo")
          optional = ("khgm_supply", "deu_hospital_purchase", "pau_hospital_purchase", "ekap")
          for key in required + optional:
              result = run_source(key)
              row = {
                  "key": key,
                  "status": result.get("status", "unknown"),
                  "fetched": int(result.get("fetched_count", 0)),
                  "relevant": int(result.get("relevant_count", result.get("notices_found", 0))),
                  "new": int(result.get("new_count", 0)),
                  "updated": int(result.get("updated_count", 0)),
                  "unchanged": int(result.get("unchanged_count", 0)),
              }
              rows.append(row)
              print(f"Source {key}: status={row['status']}, fetched={row['fetched']}, relevant={row['relevant']}, new={row['new']}")
              if key in required and (row["status"] not in {"success", "success_empty"} or row["fetched"] < 1):
                  print(f"Required source probe failed: {key}")
                  break

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("### Official-source smoke results\n\n")
                  stream.write(f"Probe date: {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n\n")
                  stream.write("| Source | Status | Fetched | Relevant | New | Updated | Unchanged |\n")
                  stream.write("|---|---|---:|---:|---:|---:|---:|\n")
                  for row in rows:
                      stream.write(f"| {row['key']} | {row['status']} | {row['fetched']} | {row['relevant']} | {row['new']} | {row['updated']} | {row['unchanged']} |\n")

          for key in required:
              row = next((item for item in rows if item["key"] == key), None)
              if row is None or row["status"] not in {"success", "success_empty"} or row["fetched"] < 1:
                  raise SystemExit(f"Required live source smoke failed: {key}")
          PY
