name: Official source live smoke test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/collector/official_html_adapter.py"
      - "backend/app/collector/filtering.py"
      - "backend/app/collector/keywords.py"
      - ".github/workflows/official-source-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1-5"

jobs:
  khgm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Fetch and screen official KHGM listing
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import os, tempfile
          temp = tempfile.mkdtemp(prefix="gozihale-smoke-")
          source_keys = "khgm_central_notices,khgm_supply,deu_hospital_purchase,pau_hospital_purchase,ekap,dmo"
          os.environ["GOZ_IHALE_ENABLED_SOURCE_KEYS"] = source_keys
          os.environ["GOZ_IHALE_HTML_SOURCE_KEYS"] = source_keys
          os.environ["GOZ_IHALE_HTML_PAGE_KHGM_CENTRAL_NOTICES"] = "https://khgm.saglik.gov.tr/TR-119527/ihale-duyurulari.html"
          os.environ["GOZ_IHALE_HTML_PAGE_KHGM_SUPPLY"] = "https://khgmsatinalmadb.saglik.gov.tr/TR-43358/duyurular.html?Sayfa=1"
          os.environ["GOZ_IHALE_HTML_PAGE_DEU_HOSPITAL_PURCHASE"] = "https://hastane2.deu.edu.tr/satin-alma/"
          os.environ["GOZ_IHALE_HTML_PAGE_PAU_HOSPITAL_PURCHASE"] = "https://www.pau.edu.tr/ihale/tr"
          os.environ["GOZ_IHALE_HTML_PAGE_EKAP"] = "https://ekap.kik.gov.tr/ekap/ilan/bultenindirme.aspx"
          os.environ["GOZ_IHALE_HTML_PAGE_DMO"] = "https://www.dmo.gov.tr/Ihale/Liste?type=1"
          os.environ["GOZ_IHALE_INGEST_DB"] = os.path.join(temp, "ingestion.db")
          os.environ["GOZ_IHALE_SCAN_DB"] = os.path.join(temp, "scan.db")
          from app.collector.runner import run_source

          primary = run_source("khgm_central_notices")
          fetched = primary.get("fetched_count", 0)
          relevant = primary.get("relevant_count", 0)
          new_count = primary.get("new_count", 0)
          print(f"Live collector result [khgm_central_notices]: status={primary.get('status')}, fetched={fetched}, relevant={relevant}, new={new_count}")
          if primary.get("status") not in {"success", "success_empty"} or fetched < 1:
              raise SystemExit("Primary official source collection failed smoke test.")

          # Additional official portals are probed independently; temporary DNS/network
          # outages must not invalidate the verified primary source.
          for source_key in ("khgm_supply", "deu_hospital_purchase", "pau_hospital_purchase", "ekap", "dmo"):
              secondary = run_source(source_key)
              print(f"Optional source result [{source_key}]: status={secondary.get('status')}, fetched={secondary.get('fetched_count', 0)}, relevant={secondary.get('relevant_count', 0)}")
          PY
