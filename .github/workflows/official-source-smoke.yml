name: Official source live smoke test

on:
  push:
    branches: [main]
    paths:
      - "backend/app/collector/official_html_adapter.py"
      - "backend/app/collector/filtering.py"
      - "backend/app/collector/keywords.py"
      - ".github/workflows/official-source-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1-5"

jobs:
  khgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Fetch and screen official KHGM listing
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import os, tempfile
          temp = tempfile.mkdtemp(prefix="gozihale-smoke-")
          os.environ["GOZ_IHALE_ENABLED_SOURCE_KEYS"] = "khgm_central_notices"
          os.environ["GOZ_IHALE_HTML_SOURCE_KEYS"] = "khgm_central_notices"
          os.environ["GOZ_IHALE_HTML_PAGE_KHGM_CENTRAL_NOTICES"] = "https://khgm.saglik.gov.tr/TR-119527/ihale-duyurulari.html"
          os.environ["GOZ_IHALE_INGEST_DB"] = os.path.join(temp, "ingestion.db")
          os.environ["GOZ_IHALE_SCAN_DB"] = os.path.join(temp, "scan.db")
          from app.collector.runner import run_source

          result = run_source("khgm_central_notices")
          fetched = result.get("fetched_count", 0)
          relevant = result.get("relevant_count", 0)
          new_count = result.get("new_count", 0)
          print(f"Live collector result: status={result.get('status')}, fetched={fetched}, relevant={relevant}, new={new_count}")
          if result.get("status") not in {"success", "success_empty"} or fetched < 1:
              raise SystemExit("Official source collection did not pass the live smoke test.")
          PY
