name: Deploy VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/VPS_AUTO_DEPLOY_SETUP.md"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gozihale-vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
      - name: Validate Python and shell scripts
        run: |
          set -euo pipefail
          python -m compileall -q backend/app backend/scripts
          bash -n backend/scripts/enable_live_collection.sh
      - name: Validate Docker Compose and build image
      
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          REMOTE_COMMAND='set -euo pipefail; cd "'"${DEPLOY_PATH}"'"; git pull --ff-only origin main; cd backend; bash scripts/enable_live_collection.sh; docker compose ps; curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/health; curl -fsS http://127.0.0.1:8000/api/scan-summary'
          ssh -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$REMOTE_COMMAND"
          {
            echo "### VPS deployment completed"
            echo "SSH deployment and post-deploy API checks completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"


  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          HOST="$(trim "$DEPLOY_HOST")"
          USER="$(trim "$DEPLOY_USER")"
          PATH_VALUE="$(trim "$DEPLOY_PATH")"
          KEY="$(printf '%s' "$SSH_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KH="$(printf '%s' "$KNOWN_HOSTS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PORT="$(trim "${DEPLOY_PORT:-22}")"
          if [[ -z "$HOST" || -z "$USER" || -z "$PATH_VALUE" || -z "$KEY" || -z "$KH" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "One or more required deployment secrets are empty."
            exit 0
          fi
          if [[ ! "$PATH_VALUE" =~ ^/[A-Za-z0-9._/-]+$ ]]; then echo "Invalid DEPLOY_PATH format."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ ! "$USER" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "Invalid DEPLOY_USER format."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ ! "$PORT" =~ ^[0-9]+$ ]] || (( PORT < 1 || PORT > 65535 )); then echo "Invalid DEPLOY_PORT format."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          {
            echo "host=$HOST"
            echo "user=$USER"
            echo "path=$PATH_VALUE"
            echo "port=$PORT"
          } >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify API
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ steps.check.outputs.host }}
          DEPLOY_USER: ${{ steps.check.outputs.user }}
          DEPLOY_PATH: ${{ steps.check.outputs.path }}
          DEPLOY_PORT: ${{ steps.check.outputs.port }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          REMOTE_COMMAND="set -euo pipefail; cd ${DEPLOY_PATH}; git pull --ff-only origin main; cd backend; if [ \$(id -u) -eq 0 ]; then bash scripts/enable_live_collection.sh || scan_exit=\$?; else sudo -n bash scripts/enable_live_collection.sh || scan_exit=\$?; fi; docker compose ps; curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/health; curl -fsS http://127.0.0.1:8000/api/scan-summary; if [ \${scan_exit:-0} -ne 0 ]; then exit \${scan_exit}; fi
          ssh -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$REMOTE_COMMAND"
          {
            echo "### VPS deployment completed"
            echo "SSH deployment and post-deploy API checks completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
