name: Deploy VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/VPS_AUTO_DEPLOY_SETUP.md"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gozihale-vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests
      - name: Validate Python and shell scripts
        run: |
          set -euo pipefail
          python -m compileall -q backend/app backend/scripts
          bash -n backend/scripts/enable_live_collection.sh
      - name: Validate Docker Compose and build image
        run: |
          set -euo pipefail
          cd backend
          cp .env.example .env
          docker compose config --quiet
          docker build -t gozihale-api:ci .

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          # Trim accidental leading/trailing whitespace from secret values.
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | xargs)"
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | xargs)"
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | xargs)"
          SSH_KEY="$(printf '%s' "$SSH_KEY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          KNOWN_HOSTS="$(printf '%s' "$KNOWN_HOSTS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          DEPLOY_PORT="$(printf '%s' "${DEPLOY_PORT:-22}" | xargs)"
          if [[ -z "${DEPLOY_HOST}" || -z "${DEPLOY_USER}" || -z "${DEPLOY_PATH}" || -z "${SSH_KEY}" || -z "${KNOWN_HOSTS}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured; deployment skipped."
            {
              echo "### VPS deployment skipped"
              echo "Required deployment secrets are missing or empty. Backend tests passed, but no SSH connection or server update was attempted."
              echo "Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (optional DEPLOY_PORT) in GitHub Actions secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ || ! "${DEPLOY_USER}" =~ ^[A-Za-z0-9._-]+$ || ! "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment path, user or port has an invalid format; deployment skipped."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          {
            echo "### VPS deployment prerequisites"
            echo "Required deployment settings are present and format-checked. The SSH deployment step will run after tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy and verify API
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          REMOTE_COMMAND="set -euo pipefail; cd ${DEPLOY_PATH}; git pull --ff-only origin main; cd backend; if [ \$(id -u) -eq 0 ]; then bash scripts/enable_live_collection.sh || scan_exit=\$?; else sudo -n bash scripts/enable_live_collection.sh || scan_exit=\$?; fi; docker compose ps; curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/api/health; curl -fsS http://127.0.0.1:8000/api/scan-summary; if [ \${scan_exit:-0} -ne 0 ]; then exit \${scan_exit}; fi
          ssh -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "$REMOTE_COMMAND"
          {
            echo "### VPS deployment completed"
            echo "SSH deployment and post-deploy API checks completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
