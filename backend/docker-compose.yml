services:
  gozihale-api:
    build: .
    container_name: gozihale-api
    restart: unless-stopped
    # Keep the API private behind Nginx; do not publish port 8000 publicly.
    ports:
      - "127.0.0.1:${GOZ_IHALE_PORT:-8000}:8000"
    environment:
      GOZ_IHALE_DB: /data/gozihale.db
      GOZ_IHALE_INGEST_DB: /data/ingestion.db
      GOZ_IHALE_SCAN_DB: /data/scan_runs.db
      GOZ_IHALE_INGEST_DB: /data/ingestion.db
      GOZ_IHALE_SCAN_DB: /data/scan_runs.db
    volumes:
      - gozihale_data:/data
volumes:
  gozihale_data:
